# Локальный запуск: docker compose up --build
# API:     http://localhost:8080  (Swagger: /swagger)
# Демо-вход: moderator@example.com / student@example.com, пароль из SEED_PASSWORD
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aggstudentdiscounts
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aggstudentdiscounts"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=aggstudentdiscounts;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      Jwt__Key: ${JWT_KEY:-local-development-key-change-me-0123456789}
      Database__MigrateOnStartup: "true"
      Seed__Enabled: "true"
      Seed__Password: ${SEED_PASSWORD:-Demo12345!}

volumes:
  pgdata:
