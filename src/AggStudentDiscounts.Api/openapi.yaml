openapi: 3.0.4
info:
  title: AggStudentDiscounts API
  description: 'API агрегатора студенческих скидок: каталог, заявки, модерация, голосование
    за актуальность.'
  version: '1.0'
paths:
  /api/admin/applications:
    get:
      tags:
      - Admin
      parameters:
      - name: status
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ApplicationListResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationListResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ApplicationListResponse'
  /api/admin/applications/{id}/approve:
    put:
      tags:
      - Admin
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlaceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/PlaceResponse'
  /api/admin/applications/{id}/reject:
    put:
      tags:
      - Admin
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectApplicationRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/RejectApplicationRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/RejectApplicationRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
  /api/admin/applications/{id}:
    put:
      tags:
      - Admin
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApplicationRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/UpdateApplicationRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/UpdateApplicationRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
  /api/admin/places/{id}:
    put:
      tags:
      - Admin
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApplicationRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/UpdateApplicationRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/UpdateApplicationRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlaceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/PlaceResponse'
  /api/applications:
    get:
      tags:
      - Applications
      parameters:
      - name: status
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ApplicationListResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationListResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ApplicationListResponse'
    post:
      tags:
      - Applications
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                PlaceName:
                  type: string
                Address:
                  type: string
                Latitude:
                  type: number
                  format: double
                Longitude:
                  type: number
                  format: double
                Discount:
                  type: string
                Conditions:
                  type: string
                ValidityPeriod:
                  type: string
                SourceUrl:
                  type: string
                ExternalId:
                  type: string
                Category:
                  type: string
                Phone:
                  type: string
                Website:
                  type: string
                WorkingHours:
                  type: string
                Photos:
                  type: array
                  items:
                    type: string
                    format: binary
            encoding:
              PlaceName:
                style: form
              Address:
                style: form
              Latitude:
                style: form
              Longitude:
                style: form
              Discount:
                style: form
              Conditions:
                style: form
              ValidityPeriod:
                style: form
              SourceUrl:
                style: form
              ExternalId:
                style: form
              Category:
                style: form
              Phone:
                style: form
              Website:
                style: form
              WorkingHours:
                style: form
              Photos:
                style: form
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
  /api/applications/{id}:
    get:
      tags:
      - Applications
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
    delete:
      tags:
      - Applications
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
  /api/auth/register:
    post:
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AuthResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /api/auth/login:
    post:
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AuthResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /api/auth/me:
    get:
      tags:
      - Auth
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/UserResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
  /api/establishments:
    get:
      tags:
      - Establishments
      parameters:
      - name: search
        in: query
        schema:
          type: string
      - name: district
        in: query
        schema:
          type: string
      - name: radius
        in: query
        schema:
          type: number
          format: double
      - name: lat
        in: query
        schema:
          type: number
          format: double
      - name: lng
        in: query
        schema:
          type: number
          format: double
      - name: sortBy
        in: query
        schema:
          type: string
      - name: sortOrder
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: query
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlaceListResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceListResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/PlaceListResponse'
  /api/establishments/{id}:
    get:
      tags:
      - Establishments
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlaceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/PlaceResponse'
  /api/establishments/{id}/votes:
    get:
      tags:
      - Establishments
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/VoteStatsResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/VoteStatsResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/VoteStatsResponse'
  /api/establishments/{id}/vote:
    post:
      tags:
      - Establishments
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoteRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/VoteRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/VoteRequest'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/VoteStatsResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/VoteStatsResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/VoteStatsResponse'
  /api/feedback/contacts:
    get:
      tags:
      - Feedback
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ContactsResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ContactsResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ContactsResponse'
  /api/geocode/suggest:
    get:
      tags:
      - Geocode
      parameters:
      - name: q
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GeoPlaceResponse'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GeoPlaceResponse'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GeoPlaceResponse'
  /api/geocode/reverse:
    get:
      tags:
      - Geocode
      parameters:
      - name: lat
        in: query
        schema:
          type: number
          format: double
      - name: lng
        in: query
        schema:
          type: number
          format: double
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/GeoPlaceResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/GeoPlaceResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/GeoPlaceResponse'
  /api/photos/{id}:
    get:
      tags:
      - Photos
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
components:
  schemas:
    ApplicationListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationResponse'
          nullable: true
        total:
          type: integer
          format: int32
      additionalProperties: false
    ApplicationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        placeName:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        category:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        workingHours:
          type: string
          nullable: true
        discount:
          type: string
          nullable: true
        conditions:
          type: string
          nullable: true
        validityPeriod:
          type: string
          nullable: true
        sourceUrl:
          type: string
          nullable: true
        photos:
          type: array
          items:
            type: string
          nullable: true
        status:
          type: string
          nullable: true
        rejectionReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        moderatedAt:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
          nullable: true
        tokenType:
          type: string
          nullable: true
        expiresIn:
          type: integer
          format: int32
        user:
          $ref: '#/components/schemas/UserResponse'
      additionalProperties: false
    ContactsResponse:
      type: object
      properties:
        telegramUrl:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
      additionalProperties: false
    GeoPlaceResponse:
      type: object
      properties:
        externalId:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        category:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        workingHours:
          type: string
          nullable: true
      additionalProperties: false
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          nullable: true
        password:
          type: string
          nullable: true
      additionalProperties: false
    PlaceListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlaceResponse'
          nullable: true
        total:
          type: integer
          format: int32
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
      additionalProperties: false
    PlaceResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        category:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        workingHours:
          type: string
          nullable: true
        discount:
          type: string
          nullable: true
        conditions:
          type: string
          nullable: true
        validityPeriod:
          type: string
          nullable: true
        photos:
          type: array
          items:
            type: string
          nullable: true
        votesYes:
          type: integer
          format: int32
        votesNo:
          type: integer
          format: int32
        lastVoteDateYes:
          type: string
          format: date-time
          nullable: true
        lastVoteDateNo:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          nullable: true
      additionalProperties: false
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          nullable: true
        password:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        university:
          type: string
          nullable: true
        department:
          type: string
          nullable: true
        course:
          type: integer
          format: int32
        telegram:
          type: string
          nullable: true
      additionalProperties: false
    RejectApplicationRequest:
      type: object
      properties:
        reason:
          type: string
          nullable: true
      additionalProperties: false
    UpdateApplicationRequest:
      type: object
      properties:
        placeName:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        category:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        workingHours:
          type: string
          nullable: true
        discount:
          type: string
          nullable: true
        conditions:
          type: string
          nullable: true
        validityPeriod:
          type: string
          nullable: true
        sourceUrl:
          type: string
          nullable: true
      additionalProperties: false
    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        university:
          type: string
          nullable: true
        department:
          type: string
          nullable: true
        course:
          type: integer
          format: int32
        telegram:
          type: string
          nullable: true
        role:
          type: string
          nullable: true
      additionalProperties: false
    VoteRequest:
      type: object
      properties:
        vote:
          type: string
          nullable: true
      additionalProperties: false
    VoteStatsResponse:
      type: object
      properties:
        'yes':
          type: integer
          format: int32
        'no':
          type: integer
          format: int32
        lastVoteDateYes:
          type: string
          format: date-time
          nullable: true
        lastVoteDateNo:
          type: string
          format: date-time
          nullable: true
        canVoteAgain:
          type: boolean
      additionalProperties: false
  securitySchemes:
    Bearer:
      type: http
      description: JWT, полученный через POST /api/auth/login
      scheme: bearer
      bearerFormat: JWT
security:
- Bearer: []
tags:
- name: Admin
- name: Applications
- name: Auth
- name: Establishments
- name: Feedback
- name: Geocode
- name: Photos
servers:
- url: http://localhost:8080
  description: Docker Compose
- url: http://localhost:5075
  description: dotnet run
